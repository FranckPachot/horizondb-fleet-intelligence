[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizondb-fleet-intelligence-api"
version = "0.1.0"
description = "Spatial and semantic fleet intelligence with Azure HorizonDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
fleet-intelligence-api = "app.server:main"
fleet-intelligence-setup = "app.setup_database:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

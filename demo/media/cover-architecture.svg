<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#122647"/>
    </linearGradient>
    <linearGradient id="rel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="geo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="vec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1e2d4d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="128" x2="1600" y2="128"/>
    <line x1="0" y1="620" x2="1600" y2="620"/>
  </g>

  <!-- Extensions strip -->
  <g transform="translate(70,70)" font-size="17" fill="#cbd5e1" font-weight="600">
    <rect x="0"   y="0" rx="16" width="104" height="38" fill="#16233f" stroke="#2b3d63"/>
    <text x="52" y="25" text-anchor="middle">postgis</text>
    <rect x="120" y="0" rx="16" width="162" height="38" fill="#16233f" stroke="#2b3d63"/>
    <text x="201" y="25" text-anchor="middle">vector (pgvector)</text>
    <rect x="298" y="0" rx="16" width="130" height="38" fill="#16233f" stroke="#2b3d63"/>
    <text x="363" y="25" text-anchor="middle">pg_diskann</text>
    <rect x="444" y="0" rx="16" width="104" height="38" fill="#16233f" stroke="#2b3d63"/>
    <text x="496" y="25" text-anchor="middle">azure_ai</text>
    <text x="576" y="25" fill="#5b7092" font-size="15" font-weight="400" font-style="italic">Azure HorizonDB · PostgreSQL 17</text>
  </g>

  <!-- ============ TABLE CARD ============ -->
  <g transform="translate(70,190)" filter="url(#soft)">
    <rect width="720" height="400" rx="18" fill="#0e1a30" stroke="#2b3d63" stroke-width="1.5"/>
    <rect width="720" height="56" rx="18" fill="#13233f"/>
    <rect y="40" width="720" height="16" fill="#13233f"/>
    <text x="28" y="36" fill="#e2e8f0" font-size="22" font-weight="700">horizon_ship.shipments</text>
    <text x="690" y="36" text-anchor="end" fill="#64748b" font-size="15" font-family="monospace">24 rows</text>

    <!-- column rows: name | type | index -->
    <g font-size="17">
      <!-- headers -->
      <text x="28"  y="86" fill="#64748b" font-size="13" font-weight="700" letter-spacing="1">COLUMN</text>
      <text x="300" y="86" fill="#64748b" font-size="13" font-weight="700" letter-spacing="1">TYPE</text>
      <text x="500" y="86" fill="#64748b" font-size="13" font-weight="700" letter-spacing="1">INDEX</text>

      <!-- relational block -->
      <g fill="#e5edf7" font-family="monospace">
        <text x="28" y="120">status</text>
        <text x="300" y="120" fill="#93c5fd">text</text>
        <text x="28" y="152">eta</text>
        <text x="300" y="152" fill="#93c5fd">date</text>
        <text x="28" y="184">title, description</text>
        <text x="300" y="184" fill="#93c5fd">text</text>
      </g>
      <rect x="500" y="104" rx="9" width="150" height="26" fill="url(#rel)"/>
      <text x="575" y="122" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">B-tree</text>
      <rect x="500" y="136" rx="9" width="150" height="26" fill="url(#rel)"/>
      <text x="575" y="154" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">B-tree</text>
      <text x="500" y="188" fill="#64748b" font-size="13" font-style="italic">(scanned)</text>

      <!-- divider -->
      <line x1="28" y1="206" x2="692" y2="206" stroke="#22314f" stroke-width="1"/>

      <!-- spatial block -->
      <g fill="#e5edf7" font-family="monospace">
        <text x="28" y="242">current_position</text>
        <text x="300" y="238" fill="#6ee7b7" font-size="15">geometry(</text>
        <text x="300" y="258" fill="#6ee7b7" font-size="15">Point, 4326)</text>
      </g>
      <rect x="500" y="224" rx="9" width="180" height="26" fill="url(#geo)"/>
      <text x="590" y="242" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">GiST (geometry)</text>
      <rect x="500" y="256" rx="9" width="180" height="26" fill="url(#geo)"/>
      <text x="590" y="274" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">GiST (geography)</text>

      <!-- divider -->
      <line x1="28" y1="298" x2="692" y2="298" stroke="#22314f" stroke-width="1"/>

      <!-- vector block -->
      <g fill="#e5edf7" font-family="monospace">
        <text x="28" y="334">embedding</text>
        <text x="300" y="334" fill="#d8b4fe">vector(1536)</text>
      </g>
      <rect x="500" y="318" rx="9" width="180" height="26" fill="url(#vec)"/>
      <text x="590" y="336" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">DiskANN · SQ 4-bit</text>

      <text x="28" y="372" fill="#8aa0c2" font-size="14" font-style="italic">embeddings generated in-database via azure_ai · default-embedding → text-embedding-3-small</text>
    </g>
  </g>

  <!-- ============ RIGHT: two query paths ============ -->
  <!-- Path A -->
  <g transform="translate(850,190)" filter="url(#soft)">
    <rect width="680" height="188" rx="18" fill="#0e1a30" stroke="#2b3d63" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="9" fill="#2563eb"/>
    <text x="56" y="44" fill="#e2e8f0" font-size="21" font-weight="700">Criteria search</text>
    <text x="56" y="70" fill="#8aa0c2" font-size="15">Deterministic form · status + ETA + map radius</text>

    <rect x="24" y="92" width="632" height="76" rx="10" fill="#0a1424" stroke="#22314f"/>
    <text x="40" y="118" font-family="monospace" font-size="14" fill="#93c5fd">WHERE status = 'exception'</text>
    <text x="40" y="140" font-family="monospace" font-size="14" fill="#6ee7b7">  AND ST_DWithin(current_position, center, 3000km)</text>
    <text x="40" y="160" font-family="monospace" font-size="13" fill="#94a3b8">→ BitmapAnd (B-tree ∩ GiST) → recheck</text>
  </g>

  <!-- Path B -->
  <g transform="translate(850,402)" filter="url(#soft)">
    <rect width="680" height="188" rx="18" fill="#0e1a30" stroke="#2b3d63" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="9" fill="#a855f7"/>
    <text x="56" y="44" fill="#e2e8f0" font-size="21" font-weight="700">Prompt-only agent</text>
    <text x="56" y="70" fill="#8aa0c2" font-size="15">gpt-5.4 + Agent Framework · one typed tool</text>

    <rect x="24" y="92" width="632" height="76" rx="10" fill="#0a1424" stroke="#22314f"/>
    <text x="40" y="118" font-family="monospace" font-size="14" fill="#93c5fd">WHERE status = 'delayed'</text>
    <text x="40" y="140" font-family="monospace" font-size="14" fill="#d8b4fe">ORDER BY embedding &lt;=&gt; query_vector  LIMIT n</text>
    <text x="40" y="160" font-family="monospace" font-size="13" fill="#94a3b8">→ DiskANNFilteredScan · Filter → Vector · TIDs</text>
  </g>

  <!-- connectors from table to paths -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M790,300 C 820,300 820,284 848,284" marker-end="url(#arrow)"/>
    <path d="M790,420 C 820,420 820,496 848,496" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ BOTTOM: unifying query ============ -->
  <g transform="translate(70,650)" filter="url(#soft)">
    <rect width="1460" height="200" rx="18" fill="#0a1424" stroke="#2b3d63" stroke-width="1.5"/>
    <text x="28" y="42" fill="#e2e8f0" font-size="20" font-weight="700">One shared query combines all three</text>
    <text x="1432" y="42" text-anchor="end" fill="#64748b" font-size="14" font-style="italic">the only difference between the paths is which filters are NULL</text>

    <g font-family="monospace" font-size="16.5">
      <text x="28" y="82"  fill="#c9d6ea"><tspan fill="#7dd3fc">SELECT</tspan> ... , <tspan fill="#d8b4fe">1 - (embedding &lt;=&gt; query_vector)</tspan> <tspan fill="#7dd3fc">AS</tspan> similarity,</text>
      <text x="28" y="108" fill="#c9d6ea">       <tspan fill="#fbbf24">0.72</tspan> * similarity + <tspan fill="#fbbf24">0.28</tspan> * (<tspan fill="#6ee7b7">1 - distance_km / radius</tspan>) <tspan fill="#7dd3fc">AS</tspan> hybrid_score</text>
      <text x="28" y="134" fill="#c9d6ea"><tspan fill="#7dd3fc">FROM</tspan> horizon_ship.shipments <tspan fill="#7dd3fc">CROSS JOIN</tspan> query_vector</text>
      <text x="28" y="160" fill="#c9d6ea"><tspan fill="#7dd3fc">WHERE</tspan> <tspan fill="#93c5fd">status = $1</tspan> <tspan fill="#7dd3fc">AND</tspan> <tspan fill="#6ee7b7">ST_DWithin(current_position, $2, $3)</tspan> <tspan fill="#7dd3fc">ORDER BY</tspan> <tspan fill="#d8b4fe">embedding &lt;=&gt; query_vector</tspan></text>
    </g>

    <!-- legend -->
    <g transform="translate(28,176)" font-size="14" font-weight="600">
      <rect x="0"   y="-12" width="14" height="14" rx="3" fill="#2563eb"/><text x="22" y="0" fill="#9fb3d1">relational (B-tree)</text>
      <rect x="180" y="-12" width="14" height="14" rx="3" fill="#10b981"/><text x="202" y="0" fill="#9fb3d1">spatial (GiST · PostGIS)</text>
      <rect x="410" y="-12" width="14" height="14" rx="3" fill="#a855f7"/><text x="432" y="0" fill="#9fb3d1">vector (DiskANN · pgvector)</text>
      <rect x="680" y="-12" width="14" height="14" rx="3" fill="#f59e0b"/><text x="702" y="0" fill="#9fb3d1">hybrid score</text>
    </g>
  </g>
</svg>
